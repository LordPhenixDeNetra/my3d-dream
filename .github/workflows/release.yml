name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm and create the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MY3D_SKIP_BROWSER: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi

      - name: Check npm credentials
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::secret NPM_TOKEN is missing or empty — Settings → Secrets and variables → Actions, exact name NPM_TOKEN, repository scope"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install
        run: npm install --no-audit --no-fund

      # `prepublishOnly` runs the test suite, so a failing suite blocks the publication.
      - name: Publish with provenance
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "my3d-dream@${version}" version >/dev/null 2>&1; then
            echo "::notice::version ${version} is already on npm, skipping the publish step"
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
