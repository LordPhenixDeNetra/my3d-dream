name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    env:
      # The browser test needs a Chromium-family browser; runners have none, so it skips itself.
      MY3D_SKIP_BROWSER: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Guard — the imported corpus must never be committed
        run: |
          if git ls-files | grep -qE '^upstream/'; then
            echo "::error::upstream/ is tracked; it must stay out of the repository"
            exit 1
          fi

      - name: Tests
        run: npm test

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurements-node${{ matrix.node }}
          path: |
            docs/*.json
            index/benchmark.json
          if-no-files-found: ignore
          retention-days: 7
